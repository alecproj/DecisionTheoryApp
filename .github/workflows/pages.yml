name: Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build folder
        run: |
          rm -rf frontend/build
          mkdir -p frontend/build
          mkdir -p frontend/build/mocks
          mkdir -p frontend/build/docs

          cp -r frontend/src/* frontend/build/
          cp -r frontend/mocks/* frontend/build/mocks/

          cp docs/openapi.yaml frontend/build/docs/openapi.yaml
          cp docs/swagger.html frontend/build/docs/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
